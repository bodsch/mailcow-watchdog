# Forgejo Actions CI — runs on every push to main and every pull request.
#
# Every step is a `make` target, so the same checks run locally and here.
#
# This file is shared with the sibling repository and is identical in both — see
# CONVENTIONS.md.
#
# Prerequisites on the Forgejo instance:
#   - Actions enabled for the repo (Settings → Actions).
#   - A registered runner whose labels include `ubuntu-latest` (adjust `runs-on`
#     below to match your runner, e.g. `docker`).
#   - The default actions registry reachable (checkout/setup-go are mirrored on
#     code.forgejo.org, Forgejo's default DEFAULT_ACTIONS_URL).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: make fmt

      - name: go vet
        run: make vet

      - name: golangci-lint (incl. gosec)
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          "$(go env GOPATH)/bin/golangci-lint" run ./...

      - name: govulncheck
        run: make vuln

      - name: Test (race detector)
        run: make test

      - name: Build
        run: make build
